kind = "mobile"
previewPath = "/mobile/"
title = "CryptoX Mobile"
version = "1.0.0"
id = "artifacts/cryptox-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 19513

[services.development]
run = "pnpm --filter @workspace/cryptox-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cryptox-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cryptox-mobile", "run", "serve" ]

[services.env]
PORT = "19513"
BASE_PATH = "/mobile/"
